<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Creación de orden</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="container">
    <div class="sidebar">
      <h3>C.R.U.D</h3>
      <ul>
        <a href="/index.html"><li>Crear orden</li></a>
        <a href="/pages/buscarOrden.html"><li>Buscar orden</li></a>
        <a href="/pages/actualizarOrden.html"><li>Actualizar orden</li></a>
        <a href="/pages/EliminarOrden.html"><li>Eliminar orden orden</li></a>
      </ul>
      <hr>
      <h3>Funcionalidades</h3>
      <ul>
        <a href="/pages/asignarPrecioMto.html"><li>Asignar valor mto</li></a>
        <a href="/pages/pagarOrden.html"><li>Realizar pago</li></a>
        <a href="/pages/reversarPago.html"><li>Reversar pago</li></a>
      </ul>
      <hr>
    </div>

    <main class="main-content">
      <h1>Creación de orden</h1>

      <!-- Contenedor de alerta -->
      <div id="alertContainer" style="display: none;"></div>

      <form id="orderForm">
        <div class="form-group">
          <label for="cliente">Cliente</label>
          <input type="text" id="cliente" required />
        </div>
        <div class="form-group">
          <label for="cedula">Cédula cliente</label>
          <input type="text" id="cedula" required />
        </div>
        <div class="form-group">
          <label for="telefono">Teléfono cliente</label>
          <input type="text" id="telefono" required />
        </div>
        <div class="form-group">
          <label for="marca">Marca equipo</label>
          <input type="text" id="marca" required />
        </div>
        <div class="form-group">
          <label for="serie">Número de serie</label>
          <input type="text" id="serie" required />
        </div>
        <div class="form-group">
          <label for="accesorios">Accesorios</label>
          <input type="text" id="accesorios" />
        </div>
        <div class="form-group">
          <label for="detalles">Detalles</label>
          <textarea id="detalles" rows="5"></textarea>
        </div>
        <button type="submit">Crear</button>
      </form>
    </main>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="scripts/main.js"></script>
</body>
</html>
