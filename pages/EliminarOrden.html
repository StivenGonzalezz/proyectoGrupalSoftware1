<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Eliminar Orden</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="../css/eliminar.css" />
</head>
<body>
  <div class="container">
    <div class="sidebar">
      <h3>C.R.U.D</h3>
      <ul>
        <a href="/index.html"><li>Crear orden</li></a>
        <a href="/pages/buscarOrden.html"><li>Buscar orden</li></a>
        <a href="/pages/actualizarOrden.html"><li>Actualizar orden</li></a>
        <a href="/pages/EliminarOrden.html"><li>Eliminar orden orden</li></a>
      </ul>
      <hr>
      <h3>Funcionalidades</h3>
      <ul>
        <a href="/pages/asignarPrecioMto.html"><li>Asignar valor mto</li></a>
        <a href="/pages/pagarOrden.html"><li>Realizar pago</li></a>
        <a href="/pages/reversarPago.html"><li>Reversar pago</li></a>
      </ul>
      <hr>
    </div>

    <div class="main-content">
      <h1>Eliminar orden</h1>

      <!-- Contenedor de alerta -->
      <div id="alertContainer" style="display: none;"></div>

      <div class="eliminar-form">
        <label for="idEliminar">ID de orden</label>
        <input type="number" id="idEliminar" />
        <button onclick="buscarParaEliminar()">Eliminar</button>
      </div>
    </div>
  </div>

  <!-- Modal de confirmación -->
  <div class="modal fade" id="modalEliminar" tabindex="-1" aria-labelledby="modalEliminarLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content" style="background-color: #222; color: white;">
        <div class="modal-header">
          <h5 class="modal-title" id="modalEliminarLabel">Confirmar eliminación</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body" id="modalBody">
          <!-- Datos de la orden -->
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-danger" onclick="confirmarEliminacion()">Eliminar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../scripts/eliminar.js"></script>
</body>
</html>
